name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            showroom-backend-sprint1/showroom-backend/package-lock.json
            showroom-frontend-sprint1/showroom-frontend/package-lock.json

      - name: Install backend
        if: matrix.app == 'backend'
        working-directory: showroom-backend-sprint1/showroom-backend
        run: npm ci
      - name: Generate Prisma client
        if: matrix.app == 'backend'
        working-directory: showroom-backend-sprint1/showroom-backend
        run: npx prisma generate
      - name: Build backend
        if: matrix.app == 'backend'
        working-directory: showroom-backend-sprint1/showroom-backend
        run: npm run build

      - name: Install frontend
        if: matrix.app == 'frontend'
        working-directory: showroom-frontend-sprint1/showroom-frontend
        run: npm ci
      - name: Typecheck frontend
        if: matrix.app == 'frontend'
        working-directory: showroom-frontend-sprint1/showroom-frontend
        run: npm run typecheck
      - name: Lint frontend
        if: matrix.app == 'frontend'
        working-directory: showroom-frontend-sprint1/showroom-frontend
        run: npm run lint
