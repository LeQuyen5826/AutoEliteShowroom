name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: build (backend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: showroom-backend/showroom-backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/showroom?schema=public

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: showroom-backend/showroom-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  frontend:
    name: build (frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: showroom-frontend/showroom-frontend

    env:
      VITE_API_URL: http://localhost:3000/api

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: showroom-frontend/showroom-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
